services:
  - type: web
    name: fileforge
    runtime: docker
    plan: free
    healthCheckPath: /api/config
    envVars:
      - key: DATABASE
        value: /data/fileforge.db
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: ANON_DAILY_LIMIT
        value: "5"
      - key: USER_DAILY_LIMIT
        value: "20"
      - key: PREMIUM_DAILY_LIMIT
        value: "200"
      - key: MAX_UPLOAD_MB
        value: "50"
      - key: PREMIUM_PRICE_RUB
        value: "999"
      - key: PREMIUM_VIDEO_SECONDS
        value: "30"
      - key: FREE_VIDEO_TRIAL_SECONDS
        value: "5"
      - key: EMAIL_VERIFICATION_ENABLED
        value: "true"
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "true"
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      # Production secrets are intentionally added later in Render:
      # FAL_KEY
      # YOOKASSA_SHOP_ID
      # YOOKASSA_SECRET_KEY
      # PUBLIC_BASE_URL
